[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sast-llm-triage"
version = "0.1.0"
description = "Single-repo SAST scan + LLM exploitability triage tool"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
semgrep = ["semgrep"]
llm-overlay = ["litellm>=1.0"]

[project.scripts]
sast-llm-triage = "triage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/triage"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length — not enforced (mypy strict covers types)

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.7",
    "ruff>=0.1",
    "pymarkdownlnt>=0.9",
]

[tool.pymarkdown.extensions]
front-matter.enabled = true

[tool.pymarkdown.plugins]
line-length.enabled = false          # MD013 — long lines are fine in docs
no-inline-html.enabled = false       # MD033 — inline HTML allowed
no-duplicate-header.enabled = false  # MD024 — duplicate headings OK in changelogs
no-emphasis-as-heading.enabled = false  # MD036 — bold text not required to be headings
