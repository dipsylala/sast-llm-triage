output:
  dir: "./output"

scan:
  context_lines: 25      # source lines of context either side of the finding line
  qualifying_cwes:
    - "22"   # Path Traversal
    - "73"   # External Control of File Name or Path
    - "77"   # Command Injection (generic)
    - "78"   # OS Command Injection
    - "79"   # Cross-Site Scripting (XSS)
    - "80"   # Basic XSS (stored)
    - "88"   # Argument Injection
    - "89"   # SQL Injection
    - "94"   # Code Injection
    - "95"   # Eval Injection
    - "98"   # PHP Remote File Inclusion
    - "120"  # Buffer Copy Without Size Check
    - "121"  # Stack-Based Buffer Overflow
    - "125"  # Out-of-Bounds Read
    - "129"  # Improper Validation of Array Index
    - "134"  # Uncontrolled Format String
    - "135"  # Incorrect Calculation of Multi-Byte String Length
    - "170"  # Improper Null Termination
    - "190"  # Integer Overflow
    - "191"  # Integer Underflow
    - "193"  # Off-by-One Error
    - "242"  # Use of Inherently Dangerous Function
    - "295"  # Improper Certificate Validation
    - "319"  # Cleartext Transmission of Sensitive Data
    - "327"  # Use of Broken/Risky Cryptographic Algorithm
    - "352"  # Cross-Site Request Forgery (CSRF)
    - "367"  # TOCTOU Race Condition
    - "415"  # Double Free
    - "416"  # Use After Free
    - "434"  # Unrestricted File Upload
    - "476"  # NULL Pointer Dereference
    - "502"  # Deserialization of Untrusted Data
    - "532"  # Sensitive Info in Log Files
    - "601"  # Open Redirect
    - "611"  # XML External Entity (XXE)
    - "787"  # Out-of-Bounds Write
    - "798"  # Hard-coded Credentials
    - "823"  # Use of Out-of-Range Pointer Offset
    - "824"  # Access of Uninitialized Pointer
    - "862"  # Missing Authorization
    - "918"  # Server-Side Request Forgery (SSRF)

semgrep:
  config: "auto"    # always pulls latest rules; semgrep caches locally
  pro: true       # set to true and export SEMGREP_APP_TOKEN to enable Pro Engine

veracode:
  package_dir_name: ".veracode"
  scan_workers: 1

snyk:
  severity_threshold: "low"   # low | medium | high | critical

llm_overlay:
  # LiteLLM model string — provider is selected by the prefix.
  # Examples:
  #   openai/gpt-4o
  #   anthropic/claude-opus-4-5
  #   ollama/qwen3:4b
  #   azure/gpt-4o  (set AZURE_API_KEY / AZURE_API_BASE in env)
  #   ollama/qwen3:4b  (local Ollama, no API key needed)
  model: "ollama/qcwind/qwen3-8b-instruct-Q4-K-M"
  # Maximum tool-call turns per finding before the verdict is forced to needs_review.
  max_turns: 10
